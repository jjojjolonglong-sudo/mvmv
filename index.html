function scnB(){const m=mv(S.Movie);if(!m.id)return bar('SCENES','')+'<div class="sc c mut">Pick a movie above</div>';const a=scenes(m),s=a.find(x=>x.id==S.sc)||a[0];if(s)S.sc=s.id;
const fr=a.map(x=>`<div class="fr ${s&&x.id==s.id?'on':''}" data-id="${x.id}">${x.image?IM(x.image,1):E([...x.line].slice(0,4).join(''))+'<br>'+E([...x.line].slice(4,8).join(''))+([...x.line].length>8?'…':'')}<small>${tf(x.time_input)}</small></div>`).join('');

<div class="sc sb">${s?`<div class="big ${s.image?'im':''}" id="big"><span class="cap">${tf(s.time_input)} ${(s.actor||[]).map(i=>E(pp(i).name)).join(', ')}</span>${IM(s.image)}${L?`<p style="font-size:${fz}px">${E(L)}</p>`:''}</div>${s.memo?`<div class="mut" style="padding:0 10px 6px">${E(s.memo)}</div>`:''}`:''}</div>`}

async function mtest(){const o=[],say=t=>{o.push(t);$('#s-t').textContent=o.join('\n')};let H;try{H={headers:{Authorization:'Bearer '+await token()}}}catch(e){say('✗ '+e.message);return}
try{const r=await fetch(MEDIA+'/',H),j=await r.json();say(`${j.bucket&&j.supabase?'✓':'✗'} Worker · R2 ${j.bucket?'ok':'NO'} · Supabase ${j.supabase?'ok':'NO'} · login ${j.auth||'?'}`)}catch(e){say('✗ '+e.message);return}
const m=D.Movie.find(x=>x.poster);if(m)try{const r=await fetch(mediaUrl(m.poster),H);say(`${r.ok?'✓':'✗'} Poster ${m.poster}: HTTP ${r.status}`)}catch(e){say('✗ '+e.message)}say('Done.')}
async function loadUF(){if(!MEDIA||UF.length)return;try{UF=(await(await fetch(MEDIA+'/fonts',{headers:{Authorization:'Bearer '+await token()}})).json()).fonts||[];ufState=UF.length+' font file(s)'}catch(e){ufState='Font list failed: '+e.message}if(cfg&&$('#s-fui')){$('#s-fui').innerHTML=fOpts('ui');$('#s-fse').innerHTML=fOpts('se')}}
const LF={};async function userFont(n){const fam='U_'+n.replace(/[^\w가-힣]/g,'_');if(LF[n])return fam;let b=await idbGet('f_'+n);if(!b){await loadUF();const f=UF.find(x=>x.name==n);if(!f)throw new Error('font not found');b=await(await fetch(f.url,{headers:{Authorization:'Bearer '+await token()}})).arrayBuffer();await idbSet('f_'+n,b)}const ff=new FontFace(fam,b);await ff.load();document.fonts.add(ff);LF[n]=1;return fam}
async function applyFont(r,v){const f=v.startsWith('u:')?await userFont(v.slice(2)):v.slice(2),q=/^(sans-serif|serif|monospace)$/.test(f)?f:`'${f}'`;document.documentElement.style.setProperty('--'+r,q+(r=='ui'?',sans-serif':',sans-serif'))}

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(ed&&ed.up>0&&['tab','sel','cfg','cancel','new','edit','bulk','save','del'].includes(a)){$('#msg').innerHTML='<div class="err">Uploading… please wait until it finishes.</div>';setTimeout(()=>$('#msg').innerHTML='',1800);return}
if(a=='tab'){tab=t.dataset.t;ed=null;cfg=false;bk=null;pg._m=0;render()}
else if(a=='pg'){pg[tab]+=+t.dataset.d;pg._m=1;render();pg._m=0}
else if(a=='sel'){S[t.dataset.k]=t.dataset.id;S.sc=null;ed=null;cfg=false;bk=null;pg._m=1;render();pg._m=0}
else if(a=='cfg'){cfg=!cfg;ed=null;bk=null;render()}else if(a=='cfgx'){cfg=false;render()}
else if(a=='new'){const s=t.dataset.s;openForm(s,null,s=='MP'||s=='Scene'?{movie:S.Movie,sort:t.dataset.sort||'배우'}:{})}
else if(a=='edit'){const s=t.dataset.s;openForm(s,t.dataset.id?D[s].find(x=>x.id==t.dataset.id):s=='Movie'?mv(S.Movie):s=='People'?pp(S.People):D.Scene.find(x=>x.id==S.sc))}
else if(a=='cancel'){ed=ed.parent||null;render()}else if(a=='save')saveForm()
else if(a=='del'){const{sh,row}=ed,msg={Movie:'Delete this movie? Its cast links and scenes are deleted too.',People:'Delete this person? Cast links to movies are deleted too.',MP:'Remove this cast link?',Scene:'Delete this scene?'}[sh]+'\nImages in storage are kept (shared with other apps).';if(!confirm(msg))return;
if(sh=='Movie'){D.Scene=D.Scene.filter(x=>x.movie!=row.id);D.MP=D.MP.filter(x=>x.movie!=row.id);S.Movie=null}if(sh=='People'){D.MP=D.MP.filter(x=>x.people!=row.id);S.People=null}if(sh=='Scene')S.sc=null;send(sh,row,true,true);ed=ed.parent||null;render()}
else if(a=='retry'){wq.unshift(...wfail);wfail=[];$('#msg').innerHTML='';pumpW()}
else if(a=='mpadd'){ed.mp.push({id:nid(),movie:ed.row.id,people:'',sort:'배우',role:'',thumb:''});rf()}
else if(a=='mpdel'){ed.mp=ed.mp.filter(x=>x.id!=t.dataset.id);rf()}
else if(a=='cal'){const d=t.closest('.dt'),k=d.querySelector('.pk');k.value=nd(d.querySelector('input:not(.pk)').value);try{k.showPicker()}catch(x){k.click()}}
else if(a=='bulk'){cfg=false;bk={sh:'Movie',rows:blank()};render()}else if(a=='bclose'){bk=null;cfg=true;render()}else if(a=='badd'){syncBk();for(let i=0;i<10;i++)bk.rows.push([]);render()}else if(a=='bsave')bsave();
else if(a=='mtest')mtest();
else if(a=='dir'){try{dirH=await showDirectoryPicker({mode:'readwrite'});idbSet('dir',dirH);render()}catch(e){alert(e.message||'Not supported in this browser')}}
else if(a=='cfgsave'){const m=$('#s-m').value.trim().replace(/\/$/,'');try{localStorage.setItem('mvmv_media',m)}catch(e){}location.reload()}
else if(a=='logout'){await logout();location.reload()}
else if(a=='login'){$('#lgm').textContent='Signing in…';try{await gotrue('password',{email:$('#em').value.trim(),password:$('#pw').value});start()}catch(x){$('#lgm').textContent=x.message}}});
document.addEventListener('change',async e=>{const t=e.target;if(t.name=='people'){t.parentNode.querySelector('[name=newp]').style.display=t.value=='__new'?'':'none'}if(t.dataset.up)upImg(t.files[0],t.dataset.up,t.dataset.n,t.dataset.r?ed.mp.find(x=>x.id==t.dataset.r):null,t.dataset.pv);
if(t.id=='s-fui'||t.id=='s-fse'){const r=t.id=='s-fui'?'ui':'se';try{localStorage.setItem('mvmv_f'+r,t.value)}catch(x){}try{await applyFont(r,t.value)}catch(x){alert('Font failed: '+x.message)}}});
document.addEventListener('click',e=>{const f=e.target.closest('.fr');if(f){S.sc=f.dataset.id;render()}});

if(t.name=='runtime'||t.name=='time_input'){t.value=hms(t.value,1);return}
if(t.id=='bsh'){syncBk();bk={sh:t.value,rows:blank()};render();return}
